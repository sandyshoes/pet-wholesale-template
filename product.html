<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Wholesale Hub - Product</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html, body { width:100%; min-height:100%; scroll-behavior:smooth; }
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--background, #fffaf5);
      color:#3b2d23;
    }
    a{text-decoration:none;color:inherit}
    button,input{font:inherit}
    button{cursor:pointer;border:none}

    .header{
      height:58px;
      background:#fff;
      border-bottom:1px solid #8d7a68;
      display:flex;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      z-index:1000;
    }
    .header-inner{
      width:100%;
      max-width:1200px;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      gap:10px;
    }
    .logo-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
      white-space:nowrap;
    }
    .logo-icon{
      width:30px;
      height:30px;
      border-radius:50%;
      background:#c79763;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:15px;
      font-weight:700;
      line-height:1;
      flex:0 0 auto;
    }
    .logo-text{
      font-size:27px;
      font-weight:700;
      color:var(--primary, #b37a39);
      white-space:nowrap;
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:24px;
      flex:1;
      margin-left:60px;
    }
    .nav a{
      font-size:14px;
      color:#222;
      font-weight:500;
    }
    .nav a:hover,.nav a.active{color:var(--primary, #b37a39)}
    .header-actions{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }
    .top-btn{
      height:34px;
      padding:0 16px;
      border-radius:999px;
      background:#f4f4f4;
      color:#2d2d2d;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
    }

    .page{
      max-width:1200px;
      margin:0 auto;
      padding:24px 14px 40px;
    }

    .layout{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:18px;
      align-items:start;
    }

    .panel{
      background:#fff;
      border:1px solid #f0e1d0;
      border-radius:18px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .panel-body{padding:16px}

    .main-img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      background:#f5f5f5;
      display:block;
      border-radius:14px;
    }
    .thumbs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .thumb{
      width:72px;
      height:72px;
      border-radius:12px;
      overflow:hidden;
      border:2px solid transparent;
      cursor:pointer;
      background:#f5f5f5;
      flex:0 0 auto;
    }
    .thumb.active{border-color:var(--primary, #b37a39)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    .title{
      font-size:28px;
      font-weight:800;
      margin:0 0 8px;
      color:#3b2d23;
    }
    .muted{color:#8b7667}
    .price{
      font-size:26px;
      font-weight:800;
      color:var(--primary, #b37a39);
      margin:10px 0 6px;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin:18px 0 10px;
      color:#6f4a25;
    }
    .opt{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .chip{
      padding:8px 12px;
      border:1px solid #d9c4b0;
      border-radius:999px;
      cursor:pointer;
      user-select:none;
      background:#fff;
      font-size:14px;
    }
    .chip.active{
      background:var(--primary, #b37a39);
      color:#fff;
      border-color:var(--primary, #b37a39);
    }

    .qty-box{
      display:inline-flex;
      align-items:center;
      border:1px solid #d9c4b0;
      border-radius:12px;
      overflow:hidden;
      background:#fff;
    }
    .qty-box button{
      width:36px;
      height:36px;
      border:0;
      background:#f2e7db;
      color:#6f4a25;
      font-size:18px;
    }
    .qty-box input{
      width:70px;
      height:36px;
      border:0;
      text-align:center;
      outline:none;
      font:inherit;
    }

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{
      height:42px;
      padding:0 18px;
      border-radius:999px;
      font-weight:800;
      border:none;
      cursor:pointer;
    }
    .btn.primary{background:var(--primary, #b37a39);color:#fff}
    .btn.dark{background:#3b2d23;color:#fff}
    .btn.light{background:#f2e7db;color:#6f4a25}

    .specs{
      margin-top:14px;
      line-height:1.8;
      color:#5f4b3e;
      font-size:14px;
      white-space:pre-wrap;
    }

    .calc-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .calc-box{
      border:1px solid #eadccd;
      border-radius:14px;
      padding:12px;
      background:#fcfaf7;
    }
    .calc-box label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:#6f4a25;
      margin-bottom:8px;
    }
    .calc-box input{
      width:100%;
      padding:10px 12px;
      border:1px solid #d9c4b0;
      border-radius:10px;
      outline:none;
    }
    .calc-line{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:8px;
      font-size:14px;
    }
    .calc-line strong{color:#945f2a}

    .recommend{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }
    .item{
      background:#fff;
      border:1px solid #eadccd;
      border-radius:14px;
      overflow:hidden;
      cursor:pointer;
    }
    .item img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      background:#f5f5f5;
    }
    .item .bd{padding:10px}
    .item .name{
      font-size:14px;
      font-weight:700;
      line-height:1.4;
      color:#3b2d23;
    }
    .item .p{
      margin-top:6px;
      font-weight:800;
      color:var(--primary, #b37a39);
    }

    @media (max-width: 1000px){
      .layout{grid-template-columns:1fr}
      .recommend{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width: 640px){
      .recommend{grid-template-columns:1fr}
      .calc-grid{grid-template-columns:1fr}
      .nav{display:none}
      .logo-text{font-size:22px}
    }
  </style>
<link rel="stylesheet" href="assets/site.css"><script src="assets/site.js"></script></head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo-wrap">
        <div class="logo-icon">P</div>
        <div class="logo-text">Pet Wholesale Hub</div>
      </div>
      <nav class="nav">
        <a href="Index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact us</a></nav>
      <div class="header-actions">
        <a class="top-btn" href="cart.html">Inquiry List</a>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="layout">
      <div class="panel">
        <div class="panel-body">
          <img id="mainImage" class="main-img" src="" alt="">
          <div id="thumbs" class="thumbs"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-body">
          <h1 id="title" class="title">Loading...</h1>
          <div id="category" class="muted"></div>
          <div class="muted">ID: <span id="pid"></span></div>
          <div id="price" class="price">$0.00</div>
          <div id="desc" class="specs"></div>

          <div class="section-title">Color</div>
          <div id="colors" class="opt"></div>

          <div class="section-title">Size</div>
          <div id="sizes" class="opt"></div>

          <div class="section-title">Quantity</div>
          <div class="qty-box">
            <button type="button" onclick="changeQty(-1)">-</button>
            <input id="qty" type="number" min="30" step="1" value="30" onchange="syncQty()">
            <button type="button" onclick="changeQty(1)">+</button>
          </div>

          <div class="row" style="margin-top:14px;">
            <button class="btn primary" id="addToCartBtn">Save to Inquiry List</button>
            <button class="btn dark" id="buyNowBtn">Request Quote</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="panel-body">
        <div class="section-title">Illustrative Margin Calculator</div>
        <div class="calc-grid">
          <div class="calc-box">
            <label for="calcQty">Quantity</label>
            <input id="calcQty" type="number" min="30" value="30">
          </div>
          <div class="calc-box">
            <label for="sellPrice">Sell Price</label>
            <input id="sellPrice" type="number" step="0.01" value="0.00">
          </div>
        </div>
        <div class="calc-line"><span>Illustrative Gross Margin</span><strong id="profit">$0.00</strong></div>
      </div>
    </div>

    <div class="panel" style="margin-top:18px;">
      <div class="panel-body">
        <div class="section-title">Recommended</div>
        <div id="recommend" class="recommend"></div>
      </div>
    </div>
  </div>

<script>
  const id = new URLSearchParams(location.search).get('id') || '';
  let product = null;
  let selectedColor = '';
  let selectedSizeObj = null;
  let selectedImage = '';

  const CART_KEY = 'pwh_cart_v2';

  function money(n) {
    return Site.money(n);
  }

  function safeJsonParse(v, fallback) {
    if (v === null || v === undefined || v === '') return fallback;
    if (Array.isArray(v) || typeof v === 'object') return v;
    try {
      return JSON.parse(v);
    } catch (e) {
      return fallback;
    }
  }

  function safeArr(v) {
    const r = safeJsonParse(v, []);
    return Array.isArray(r) ? r : [];
  }

  function getId(p) {
    return p?.id || p?.pid || p?.productId || id || '';
  }

  function getName(p) {
    return p?.name || p?.product_name || p?.productName || p?.title || 'Product';
  }

  function getDesc(p) {
    return p?.description || p?.desc || p?.details || '';
  }

  function getStatus(p) {
    return p?.status || p?.enabled || 'on';
  }

  function getImages(p) {
    const imgs = safeArr(p?.images);
    if (imgs.length) return imgs.map(x=>Site.image(x));
    if (p?.image) return [Site.image(p.image)];
    if (p?.mainImage) return [Site.image(p.mainImage)];
    return [];
  }

  function getColors(p) {
    const arr = safeArr(p?.colors);
    if (arr.length) return arr;
    return p?.color ? [p.color] : [];
  }

  function getSizes(p) {
    const arr = safeArr(p?.sizes);
    if (arr.length) return arr;
    return p?.size ? [p.size] : [];
  }

  function getOptionLabel(opt) {
    if (opt == null) return '';
    if (typeof opt === 'string' || typeof opt === 'number') return String(opt);
    return String(
      opt.label ?? opt.name ?? opt.value ?? opt.size ?? opt.text ?? ''
    );
  }

  function getOptionPrice(opt) {
    if (opt == null) return NaN;
    if (typeof opt === 'number') return opt;
    if (typeof opt === 'string') return NaN;
    const v = opt.price ?? opt.salePrice ?? opt.sellPrice ?? opt.amount;
    const n = Number(v);
    return Number.isFinite(n) ? n : NaN;
  }

  function getBasePrice(p) {
    const n = Number(p?.price ?? p?.basePrice ?? p?.salePrice ?? p?.sellPrice ?? 0);
    return Number.isFinite(n) ? n : 0;
  }

  function getCurrentPrice(p, sizeObj) {
    const specs = safeJsonParse(p?.specs, {});
    const label = getOptionLabel(sizeObj);
    if (label && specs && specs[label] != null) {
      const price = Number(specs[label]);
      if (Number.isFinite(price)) return price;
    }
    const sizePrice = getOptionPrice(sizeObj);
    return Number.isFinite(sizePrice) ? sizePrice : getBasePrice(p);
  }

  function renderThumbs(images) {
    const thumbs = document.getElementById('thumbs');
    const main = document.getElementById('mainImage');
    thumbs.innerHTML = '';

    const list = images.length ? images : ['assets/placeholder.svg'];

    list.forEach((src, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb' + (idx === 0 ? ' active' : '');
      const image=document.createElement('img');image.src=Site.image(src);image.alt=getName(product);wrap.append(image);
      wrap.onclick = () => {
        selectedImage = src || '';
        main.src = selectedImage || '';
        thumbs.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
        wrap.classList.add('active');
      };
      thumbs.appendChild(wrap);
    });

    selectedImage = list[0] || '';
    main.src = selectedImage || '';
  }

  function renderChips(list, containerId, type) {
    const box = document.getElementById(containerId);
    box.innerHTML = '';

    if (!list.length) {
      box.innerHTML = '<div class="muted">No options specified.</div>';
      return;
    }

    list.forEach((opt, idx) => {
      const label = getOptionLabel(opt);
      const chip = document.createElement('div');
      chip.className = 'chip' + (idx === 0 ? ' active' : '');
      chip.textContent = label || '-';
      chip.onclick = () => {
        box.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        chip.classList.add('active');

        if (type === 'color') selectedColor = label;
        if (type === 'size') selectedSizeObj = opt;

        updatePrice();
        updateCalculator();
      };
      box.appendChild(chip);
    });

    if (type === 'color') selectedColor = getOptionLabel(list[0]);
    if (type === 'size') selectedSizeObj = list[0];
  }

  function syncQty() {
    const qtyEl = document.getElementById('qty');
    const calcQtyEl = document.getElementById('calcQty');
    let q = parseInt(qtyEl.value, 10);
    q=Site.quantity(q);
    qtyEl.value = q;
    if (calcQtyEl) calcQtyEl.value = q;
    updateCalculator();
  }

  function changeQty(delta) {
    const qtyEl = document.getElementById('qty');
    let q = parseInt(qtyEl.value, 10);
    if (!Number.isFinite(q)) q=Site.minimum();
    q += delta*Site.step();
    q=Site.quantity(q);
    qtyEl.value = q;
    const calcQtyEl = document.getElementById('calcQty');
    if (calcQtyEl) calcQtyEl.value = q;
    updateCalculator();
  }

  function updatePrice() {
    const price = getCurrentPrice(product, selectedSizeObj);
    document.getElementById('price').textContent = price>0 ? money(price) : 'Request quote';
    const sell = document.getElementById('sellPrice');
    if (sell && (!sell.value || Number(sell.value) === 0)) {
      sell.value = Number(price).toFixed(2);
    }
  }

  function updateCalculator() {
    const qty = Site.quantity(document.getElementById('calcQty').value);
    const sellPrice = Number(document.getElementById('sellPrice').value || 0);
    const cost = Number(getCurrentPrice(product, selectedSizeObj) || 0);
    const profit = (sellPrice - cost) * qty;
    document.getElementById('profit').textContent = money(profit);
    document.getElementById('calcQty').value = qty;
  }

  function normalizeQty(v) {
    let q = parseInt(v, 10);
    if (!Number.isFinite(q) || q < 30) q = 30;
    return q;
  }

  function cartKey(item) {
    return [
      String(item.product_id || item.id || ''),
      String(item.color || ''),
      String(item.size || '')
    ].join('::');
  }

  function loadCart() {
    try {
      const raw = localStorage.getItem(CART_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function addItemToCart(goCheckout) {
    if (!product) return;

    const qty = normalizeQty(document.getElementById('qty').value);
    const unitPrice = getCurrentPrice(product, selectedSizeObj);
    const sizeLabel = selectedSizeObj ? getOptionLabel(selectedSizeObj) : '';

    const item = {
      id: String(getId(product)),
      name: getName(product),
      image: selectedImage || getImages(product)[0] || '',
      price: Number(unitPrice),
      qty: qty,
      count: qty,
      color: selectedColor || '',
      size: sizeLabel || '',
      product_id: String(getId(product)),
      product_name: getName(product)
    };

    const cart = loadCart();
    const key = cartKey(item);
    const idx = cart.findIndex(x => cartKey(x) === key);

    if (idx >= 0) {
      const mergedQty = Number(cart[idx].qty || cart[idx].count || 0) + qty;
      cart[idx].qty = mergedQty;
      cart[idx].count = mergedQty;
      cart[idx].price = Number(unitPrice);
      cart[idx].image = item.image;
      cart[idx].name = item.name;
      cart[idx].product_name = item.product_name;
    } else {
      cart.push(item);
    }

    saveCart(cart);
    alert(idx >= 0 ? 'Item quantity updated in cart.' : 'Item added to cart.');

    if (goCheckout) {
      location.href = 'checkout.html';
    }
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function loadProduct() {
    try {
      const res = await fetch('get_product.php?id=' + encodeURIComponent(id), { cache: 'no-store' });
      const json = await res.json();
      if (!res.ok || !json.success || !json.data) throw new Error(json.message || 'Load failed');
      product = json.data;
      if (!product) throw new Error('No product data');

      document.getElementById('title').textContent = getName(product);
      document.getElementById('pid').textContent = getId(product);
      document.getElementById('category').textContent = product.category || product.cat || '';
      document.getElementById('desc').textContent = getDesc(product) || 'Contact the store for detailed specifications.';

      const images = getImages(product);
      renderThumbs(images);

      const colors = getColors(product);
      const sizes = getSizes(product);

      renderChips(colors, 'colors', 'color');
      renderChips(sizes, 'sizes', 'size');

      document.getElementById('qty').value = Site.minimum();
      document.getElementById('calcQty').value = Site.minimum();

      const currentUnit = getCurrentPrice(product, selectedSizeObj);
      document.getElementById('sellPrice').value = Number(currentUnit).toFixed(2);

      updatePrice();
      updateCalculator();

      const rec = await fetch('get_products.php', { cache: 'no-store' });
      const all = await rec.json();
      if (!rec.ok || !all.success) {
        renderRecommend([]);
        return;
      }
      const list = all.data || all.products || all || [];
      renderRecommend(Array.isArray(list) ? list : []);
    } catch (e) {
      console.error(e);
      product = null;
      document.getElementById('title').textContent = e.message || 'Load failed';
      document.getElementById('addToCartBtn').disabled = true;
      document.getElementById('buyNowBtn').disabled = true;
    }
  }

  function renderRecommend(list) {
    const box = document.getElementById('recommend');
    const currentId = String(getId(product));
    const filtered = list
      .filter(p => getStatus(p) === 'on' && String(getId(p)) !== currentId)
      .slice(0, 4);

    if (!filtered.length) {
      box.innerHTML = '<div class="muted">No recommended products available.</div>';
      return;
    }

    box.replaceChildren();
    filtered.forEach(p=>{const a=document.createElement('a');a.className='item';a.href='product.html?id='+encodeURIComponent(getId(p));const img=document.createElement('img');img.src=Site.image(getImages(p)[0]);img.alt=getName(p);const body=document.createElement('div');body.className='bd';const name=document.createElement('div');name.className='name';name.textContent=getName(p);const price=document.createElement('div');price.className='p';price.textContent=getBasePrice(p)>0?money(getBasePrice(p)):'Request quote';body.append(name,price);a.append(img,body);box.append(a)});

  }

  document.getElementById('qty').addEventListener('blur', syncQty);
  document.getElementById('qty').addEventListener('change', syncQty);
  document.getElementById('calcQty').addEventListener('change', updateCalculator);
  document.getElementById('sellPrice').addEventListener('input', updateCalculator);
  document.getElementById('addToCartBtn').addEventListener('click', () => addItemToCart(false));
  document.getElementById('buyNowBtn').addEventListener('click',()=>{if(product)Site.quote(getName(product)+' ['+getId(product)+']\nQuantity: '+Site.quantity(document.getElementById('qty').value)+'\nColor: '+selectedColor+'\nSize: '+getOptionLabel(selectedSizeObj)+'\nIndicative unit price: '+money(getCurrentPrice(product,selectedSizeObj)));});
  window.addEventListener('brand-ready',()=>{if(product){updatePrice();updateCalculator();}});

  loadProduct();
</script>
</body>
</html>
